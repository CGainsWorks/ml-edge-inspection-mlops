[pytest]
testpaths = tests
addopts = -q
markers =
    slow: takes more than a couple of seconds
    needs_dataset: needs the generated dataset (scripts/make_dataset.py)
    needs_model: needs a trained checkpoint (scripts/train.py)
    needs_onnx: needs the exported ONNX graphs (scripts/export_onnx.py)
    needs_cuda: needs a CUDA GPU
    needs_torch: needs torch (training and export paths)
