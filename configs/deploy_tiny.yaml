# Deployment and gate thresholds for the `tiny` dataset preset.
#
# Used by `make demo-quick` and therefore by CI.  The gate's *shape* is
# identical to configs/deploy.yaml -- improve materially on the distribution
# that triggered the alert, do not regress on the one already handled, clear
# absolute floors on both -- and only the absolute numbers differ.
#
# This is not the gate being relaxed to make CI green.  An absolute accuracy
# floor is a property of the dataset, and CI trains on a tenth of the data:
# 160 training frames against 1,600, and 100 test frames against 600.  The
# baseline itself reaches 0.856 AUROC on the tiny test split against 0.882 on
# the full one, so a 0.85 floor calibrated for the full dataset blocks every
# candidate CI could ever produce -- including ones that are working perfectly.
# A gate that can only ever say no is as useless as one that can only say yes.
#
# Two of the numbers below are set by measurement resolution rather than by
# taste, which is the part worth reading:
#
#   * `max_drop` is 0.04, not 0.02.  The tiny test split has 100 frames, 50 of
#     them defective, so the standard error on AUROC is roughly 0.04.  A 0.02
#     regression allowance is below the noise floor: it would reject half of all
#     identical models and pass half of genuinely worse ones.
#   * the false positive rate ceiling is 0.12, not 0.05.  With 50 negatives in
#     the test split the measured rate moves in steps of 0.02 and has a standard
#     error of about 0.04, so 0.05 is finer than the measurement.
#
# The full-dataset thresholds are the ones the published results were gated on.

model_name: surface-defect
artefact: int8

# Shorter than the full profile's 400, but still at least the policy window of
# 200 -- a reference shorter than the window it is compared against makes every
# statistic unstable in the direction that matters.
reference_frames: 240

gate:
  improvement:
    metric: drift.image.auroc
    min_delta: 0.03          # unchanged: the recovery is large, not marginal
  regression:
    metric: reference.image.auroc
    max_drop: 0.04           # the measurement resolution on 100 test frames
  floors:
    - metric: reference.image.auroc
      min: 0.78              # the tiny baseline reaches 0.856
    - metric: drift.image.auroc
      min: 0.70
    - metric: reference.image.false_positive_rate
      max: 0.12              # 50 test negatives: steps of 0.02, se about 0.04

canary:
  frames: 150
  stream: clean
  max_flagged_rate: 0.35
  min_flagged_rate: 0.001
  max_latency_p95_ms: 250.0
